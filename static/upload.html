<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📁 知识库管理 — RAG 文档上传</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #2a2f3a;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #6366f1;
      --accent-hover: #4f52e0;
      --ok: #22c55e;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .subtitle { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .formats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .formats span {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.06);
      color: var(--text);
    }
    .dropzone .icon { font-size: 40px; display: block; margin-bottom: 12px; }
    .dropzone input[type="file"] { display: none; }
    .file-info {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text);
      display: none;
    }
    .file-info.visible { display: block; }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .progress {
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      margin-top: 20px;
      overflow: hidden;
      display: none;
    }
    .progress.visible { display: block; }
    .progress .bar {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.2s;
    }
    .status { margin-top: 20px; font-size: 14px; line-height: 1.7; display: none; }
    .status.visible { display: block; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .status code {
      background: var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
    }
    .hint { margin-top: 24px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📁 知识库管理</h1>
    <p class="subtitle">
      上传文档到 RAG 知识库。文件将异步解析、语义切块并向量化入库，
      上传完成后可用返回的 task_id 查询处理进度。
    </p>
    <div class="formats">
      <span>PDF</span><span>DOCX</span><span>MD</span><span>TXT</span>
    </div>

    <div class="dropzone" id="dropzone">
      <span class="icon">📄</span>
      <div>拖拽文件到这里，或点击选择文件</div>
      <input type="file" id="fileInput" accept=".pdf,.docx,.md,.txt" />
    </div>

    <div class="file-info" id="fileInfo"></div>

    <button id="uploadBtn" disabled>上传到知识库</button>

    <div class="progress" id="progress"><div class="bar" id="progressBar"></div></div>

    <div class="status" id="status"></div>

    <div class="hint">
      状态查询：上传成功后会返回 task_id，可点击「查询状态」按钮，
      或通过 <code>GET /api/v1/tasks/{task_id}</code> 查询处理进度。
    </div>
  </main>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const fileInfo = document.getElementById("fileInfo");
    const uploadBtn = document.getElementById("uploadBtn");
    const progress = document.getElementById("progress");
    const progressBar = document.getElementById("progressBar");
    const status = document.getElementById("status");

    let selectedFile = null;

    function setStatus(text, kind) {
      status.textContent = "";
      status.className = "status visible" + (kind ? " " + kind : "");
      status.innerHTML = text;
    }

    function showFile(file) {
      selectedFile = file;
      const sizeKb = file.size / 1024;
      const sizeText = sizeKb < 1024 ? sizeKb.toFixed(1) + " KB" : (sizeKb / 1024).toFixed(1) + " MB";
      fileInfo.textContent = "已选择：" + file.name + "（" + sizeText + "）";
      fileInfo.classList.add("visible");
      uploadBtn.disabled = false;
      setStatus("");
      status.classList.remove("visible");
    }

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      const files = e.dataTransfer.files;
      if (files && files.length > 0) showFile(files[0]);
    });
    fileInput.addEventListener("change", () => {
      if (fileInput.files && fileInput.files.length > 0) showFile(fileInput.files[0]);
    });

    uploadBtn.addEventListener("click", () => {
      if (!selectedFile) return;

      uploadBtn.disabled = true;
      progress.classList.add("visible");
      progressBar.style.width = "0%";
      setStatus("📤 正在上传 " + selectedFile.name + " ...");

      const formData = new FormData();
      formData.append("file", selectedFile);
      formData.append("kb_id", "default");

      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/v1/ingest");

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          progressBar.style.width = pct + "%";
        }
      };

      xhr.onload = () => {
        progressBar.style.width = "100%";
        if (xhr.status === 202) {
          let payload = {};
          try { payload = JSON.parse(xhr.responseText); } catch (err) { /* ignore */ }
          const taskId = payload.task_id || "";
          setStatus(
            "✅ 文档 <strong>" + escapeHtml(selectedFile.name) + "</strong> 已提交处理<br>" +
            "task_id: <code>" + escapeHtml(taskId) + "</code><br><br>" +
            '<button onclick="checkTask(\'' + escapeHtml(taskId) + '\')">🔍 查询状态</button>',
            "ok"
          );
        } else {
          setStatus("❌ 上传失败（HTTP " + xhr.status + "）：" + escapeHtml(xhr.responseText), "err");
        }
        uploadBtn.disabled = false;
      };

      xhr.onerror = () => {
        setStatus("❌ 网络错误，上传失败，请确认 RAG 网关已启动。", "err");
        uploadBtn.disabled = false;
      };

      xhr.send(formData);
    });

    window.checkTask = function (taskId) {
      if (!taskId) return;
      setStatus("⏳ 正在查询任务状态 ...");
      fetch("/api/v1/tasks/" + encodeURIComponent(taskId))
        .then((resp) => {
          if (resp.status === 404) {
            setStatus("❌ 任务不存在：" + escapeHtml(taskId), "err");
            return null;
          }
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          return resp.json();
        })
        .then((task) => {
          if (!task) return;
          const state = task.status || "UNKNOWN";
          setStatus(
            "🔍 任务状态：<strong>" + escapeHtml(state) + "</strong><br>" +
            "文件：" + escapeHtml(task.source_file || "") + "<br>" +
            "task_id：<code>" + escapeHtml(task.task_id || taskId) + "</code>" +
            (task.error_message ? "<br>错误信息：" + escapeHtml(task.error_message) : ""),
            state === "FAILED" ? "err" : "ok"
          );
        })
        .catch((err) => setStatus("❌ 查询失败：" + escapeHtml(err.message), "err"));
    };

    function escapeHtml(text) {
      return String(text == null ? "" : text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
